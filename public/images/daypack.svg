<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#glow)"/>
  <!-- Phone (left) -->
  <rect x="100" y="120" width="150" height="230" rx="20" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <rect x="108" y="128" width="134" height="214" rx="14" fill="rgba(15,23,42,0.6)"/>
  <text x="175" y="160" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="rgba(255,255,255,0.7)" text-anchor="middle">opencode</text>
  <text x="175" y="182" font-family="monospace" font-size="9" fill="rgba(34,197,94,0.9)">● connected</text>
  <text x="175" y="210" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.5)">~/side/daypack</text>
  <text x="175" y="226" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.4)">$ fix the bug</text>
  <rect x="175" y="238" width="100" height="10" rx="5" fill="rgba(255,255,255,0.15)"/>
  <rect x="175" y="252" width="74" height="10" rx="5" fill="rgba(255,255,255,0.12)"/>
  <rect x="175" y="266" width="88" height="10" rx="5" fill="rgba(255,255,255,0.12)"/>
  <!-- MacBook (right) -->
  <rect x="470" y="150" width="260" height="170" rx="10" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <rect x="470" y="150" width="260" height="28" rx="10" fill="rgba(255,255,255,0.06)"/>
  <circle cx="486" cy="164" r="5" fill="#ef4444"/>
  <circle cx="502" cy="164" r="5" fill="#fbbf24"/>
  <circle cx="518" cy="164" r="5" fill="#22c55e"/>
  <text x="600" y="169" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.4)" text-anchor="middle">opencode web :4096</text>
  <text x="486" y="206" font-family="monospace" font-size="12" fill="#22c55e">$ opencode web</text>
  <text x="486" y="228" font-family="monospace" font-size="12" fill="rgba(255,255,255,0.7)">  127.0.0.1:4096</text>
  <text x="486" y="250" font-family="monospace" font-size="12" fill="rgba(255,255,255,0.5)">  tailscaled (mesh)</text>
  <text x="486" y="272" font-family="monospace" font-size="12" fill="rgba(255,255,255,0.5)">  caffeinate -dimsu</text>
  <!-- Tunnel center -->
  <rect x="280" y="200" width="160" height="56" rx="28" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <text x="360" y="223" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="rgba(255,255,255,0.7)" text-anchor="middle">Tailscale</text>
  <text x="360" y="241" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.4)" text-anchor="middle">serve + TLS</text>
  <!-- Connection lines -->
  <line x1="250" y1="228" x2="280" y2="228" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
  <line x1="440" y1="228" x2="470" y2="228" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
  <!-- Padlock -->
  <rect x="330" y="296" width="60" height="24" rx="12" fill="rgba(34,197,94,0.15)" stroke="rgba(34,197,94,0.4)" stroke-width="1"/>
  <text x="360" y="312" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#22c55e" text-anchor="middle">🔒 no ports</text>
  <!-- Title text -->
  <text x="400" y="70" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="white" text-anchor="middle" letter-spacing="1">daypack</text>
  <text x="400" y="98" font-family="system-ui, sans-serif" font-size="14" font-weight="300" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="2">PHONE → MAC, ANYWHERE</text>
  <!-- Footer labels -->
  <text x="400" y="402" font-family="system-ui, sans-serif" font-size="13" font-weight="300" fill="rgba(255,255,255,0.35)" text-anchor="middle">Your Mac as a pocket machine</text>
</svg>
