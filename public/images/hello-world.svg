<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="200" cy="150" r="250" fill="url(#glow)"/>
  <circle cx="600" cy="350" r="180" fill="rgba(255,255,255,0.05)"/>
  <text x="400" y="200" font-family="system-ui, sans-serif" font-size="64" font-weight="700" fill="white" text-anchor="middle" letter-spacing="2">Hello</text>
  <text x="400" y="270" font-family="system-ui, sans-serif" font-size="40" font-weight="300" fill="rgba(255,255,255,0.8)" text-anchor="middle" letter-spacing="4">WORLD</text>
  <line x1="300" y1="300" x2="500" y2="300" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <circle cx="400" cy="300" r="4" fill="white"/>
</svg>
