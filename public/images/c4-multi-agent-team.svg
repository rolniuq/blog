<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#glow)"/>
  <!-- Leader node (center top) -->
  <rect x="320" y="80" width="160" height="48" rx="24" fill="rgba(99,102,241,0.25)" stroke="rgba(99,102,241,0.5)" stroke-width="2"/>
  <text x="400" y="108" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#a5b4fc" text-anchor="middle">Leader</text>
  <!-- Dev nodes (bottom row) -->
  <rect x="70" y="250" width="180" height="44" rx="22" fill="rgba(34,197,94,0.15)" stroke="rgba(34,197,94,0.35)" stroke-width="1.5"/>
  <text x="160" y="276" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#4ade80" text-anchor="middle">Dev-1 · Backend</text>
  <rect x="310" y="250" width="180" height="44" rx="22" fill="rgba(34,197,94,0.15)" stroke="rgba(34,197,94,0.35)" stroke-width="1.5"/>
  <text x="400" y="276" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#4ade80" text-anchor="middle">Dev-2 · Frontend</text>
  <rect x="550" y="250" width="180" height="44" rx="22" fill="rgba(34,197,94,0.15)" stroke="rgba(34,197,94,0.35)" stroke-width="1.5"/>
  <text x="640" y="276" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#4ade80" text-anchor="middle">Dev-3 · DevOps</text>
  <!-- Connection lines: Leader to Devs -->
  <line x1="360" y1="128" x2="160" y2="250" stroke="rgba(99,102,241,0.3)" stroke-width="2"/>
  <line x1="400" y1="128" x2="400" y2="250" stroke="rgba(99,102,241,0.3)" stroke-width="2"/>
  <line x1="440" y1="128" x2="640" y2="250" stroke="rgba(99,102,241,0.3)" stroke-width="2"/>
  <!-- Task flow arrows -->
  <polygon points="190,190 180,200 200,200" fill="rgba(99,102,241,0.4)"/>
  <polygon points="400,190 390,200 410,200" fill="rgba(99,102,241,0.4)"/>
  <polygon points="610,190 600,200 630,200" fill="rgba(99,102,241,0.4)"/>
  <!-- Task labels on lines -->
  <text x="250" y="178" font-family="monospace" font-size="10" fill="rgba(99,102,241,0.5)" text-anchor="middle">task-001</text>
  <text x="400" y="178" font-family="monospace" font-size="10" fill="rgba(99,102,241,0.5)" text-anchor="middle">task-002</text>
  <text x="550" y="178" font-family="monospace" font-size="10" fill="rgba(99,102,241,0.5)" text-anchor="middle">task-003</text>
  <!-- Review arrows (dashed, going up) -->
  <line x1="180" y1="250" x2="340" y2="128" stroke="rgba(250,204,21,0.25)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="420" y1="250" x2="440" y2="128" stroke="rgba(250,204,21,0.25)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="620" y1="250" x2="480" y2="128" stroke="rgba(250,204,21,0.25)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <!-- Review labels -->
  <text x="260" y="238" font-family="monospace" font-size="9" fill="rgba(250,204,21,0.4)" text-anchor="middle">review</text>
  <text x="430" y="238" font-family="monospace" font-size="9" fill="rgba(250,204,21,0.4)" text-anchor="middle">review</text>
  <text x="555" y="238" font-family="monospace" font-size="9" fill="rgba(250,204,21,0.4)" text-anchor="middle">review</text>
  <!-- Title -->
  <text x="400" y="370" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="white" text-anchor="middle" letter-spacing="2">C4</text>
  <text x="400" y="398" font-family="system-ui, sans-serif" font-size="14" font-weight="300" fill="rgba(255,255,255,0.45)" text-anchor="middle" letter-spacing="4">MULTI-AGENT AI TEAM</text>
  <!-- Bottom tagline -->
  <text x="400" y="430" font-family="system-ui, sans-serif" font-size="12" font-weight="300" fill="rgba(255,255,255,0.3)" text-anchor="middle" letter-spacing="2">Leader + 3 Developers · Self-Organizing · Event-Driven</text>
</svg>
